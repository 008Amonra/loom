<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" width="1920" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ebe5d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background — warm paper -->
  <rect width="1920" height="400" fill="url(#bg)" />

  <!-- Top rule -->
  <line x1="120" y1="60" x2="1800" y2="60" stroke="#1a1a1a" stroke-width="3" />
  <line x1="120" y1="66" x2="1800" y2="66" stroke="#1a1a1a" stroke-width="0.5" />

  <!-- Line 1: newspaper. -->
  <text x="960" y="150" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="700" fill="#1a1a1a" letter-spacing="2">newspaper.</text>

  <!-- Line 2: 45dgof8. -->
  <text x="960" y="210" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="700" fill="#1a1a1a" letter-spacing="2">45dgof8.</text>

  <!-- Line 3: com -->
  <text x="960" y="270" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="700" fill="#1a1a1a" letter-spacing="2">com</text>

  <!-- Bottom rules -->
  <line x1="120" y1="310" x2="1800" y2="310" stroke="#1a1a1a" stroke-width="0.5" />
  <line x1="120" y1="316" x2="1800" y2="316" stroke="#1a1a1a" stroke-width="3" />

  <!-- Tagline -->
  <text x="960" y="360" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="15" fill="#888" letter-spacing="8">SIGNALS FROM THE NOISE</text>

  <!-- Corner ornaments -->
  <path d="M 120 55 L 120 45 L 130 45" fill="none" stroke="#1a1a1a" stroke-width="1" />
  <path d="M 1800 55 L 1800 45 L 1790 45" fill="none" stroke="#1a1a1a" stroke-width="1" />
  <path d="M 120 321 L 120 331 L 130 331" fill="none" stroke="#1a1a1a" stroke-width="1" />
  <path d="M 1800 321 L 1800 331 L 1790 331" fill="none" stroke="#1a1a1a" stroke-width="1" />
</svg>
